<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos críticos - Panel Administrador</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-wrapper">
        <!-- ===== MENÚ LATERAL ===== -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <img src="../img/logo digital audio.png" alt="Digital Sounds">
                <span>Digital Sounds</span>
            </div>
            <nav class="admin-menu">
                <a href="home.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                <a href="ordenes.html"><i class="bi bi-receipt"></i> Órdenes</a>
                <a href="productos.html" class="activo"><i class="bi bi-box-seam"></i> Productos</a>
                <a href="categorias.html" class="solo-admin"><i class="bi bi-tags"></i> Categorías</a>
                <a href="usuarios.html" class="solo-admin"><i class="bi bi-people"></i> Usuarios</a>
                <a href="reportes.html" class="solo-admin"><i class="bi bi-bar-chart-line"></i> Reportes</a>
                <a href="perfil.html"><i class="bi bi-person-circle"></i> Perfil</a>
                <a href="../proyecto.html"><i class="bi bi-shop"></i> Ver tienda</a>
            </nav>
            <div class="admin-usuario-box">
                <div class="nombre" id="admin-usuario-nombre">-</div>
                <div class="rol" id="admin-usuario-rol">-</div>
                <button class="btn-cerrar-sesion" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
            </div>
        </aside>

        <!-- ===== CONTENIDO ===== -->
        <main class="admin-contenido">
            <div class="admin-topbar">
                <div>
                    <h1>Listado de productos críticos</h1>
                    <p class="admin-subtitulo">Productos agotados o con stock igual o menor a su stock crítico.</p>
                </div>
                <a href="productos.html" class="btn-admin secundario"><i class="bi bi-arrow-left"></i> Volver a productos</a>
            </div>

            <div class="mini-resumen" id="resumen-criticos"></div>

            <div class="admin-panel">
                <table class="tabla-admin">
                    <thead>
                        <tr><th>Código</th><th>Nombre</th><th>Categoría</th><th>Stock</th><th>Stock crítico</th><th>Estado</th><th>Acciones</th></tr>
                    </thead>
                    <tbody id="tabla-criticos-body"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/baseDeDatos.js"></script>
    <script src="../js/usuariosDB.js"></script>
    <script src="../js/ordenesDB.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/productos-criticos.js"></script>
</body>
</html>
