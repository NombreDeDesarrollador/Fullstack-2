<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="titulo-pagina">Nuevo Usuario - Panel Administrador</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <img src="../img/logo digital audio.png" alt="Digital Sounds">
                <span>Digital Sounds</span>
            </div>
            <nav class="admin-menu">
                <a href="home.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                <a href="productos.html"><i class="bi bi-box-seam"></i> Productos</a>
                <a href="usuarios.html" class="activo solo-admin"><i class="bi bi-people"></i> Usuarios</a>
                <a href="../proyecto.html"><i class="bi bi-shop"></i> Ver tienda</a>
            </nav>
            <div class="admin-usuario-box">
                <div class="nombre" id="admin-usuario-nombre">-</div>
                <div class="rol" id="admin-usuario-rol">-</div>
                <button class="btn-cerrar-sesion" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
            </div>
        </aside>

        <main class="admin-contenido">
            <div class="admin-topbar">
                <h1 id="titulo-form">Nuevo Usuario</h1>
                <a href="usuarios.html" class="btn-admin secundario"><i class="bi bi-arrow-left"></i> Volver al listado</a>
            </div>

            <form class="form-admin" id="form-usuario" novalidate>
                <input type="hidden" id="run-original">

                <div class="fila-2">
                    <div class="campo">
                        <label for="run">RUN (sin puntos ni guion, ej: 19011022K)</label>
                        <input type="text" id="run" placeholder="19011022K">
                        <div class="mensaje-error-admin" id="err-run"></div>
                    </div>
                    <div class="campo">
                        <label for="fechaNacimiento">Fecha de nacimiento (opcional)</label>
                        <input type="date" id="fechaNacimiento">
                    </div>
                </div>

                <div class="fila-2">
                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" placeholder="Nombre">
                        <div class="mensaje-error-admin" id="err-nombre"></div>
                    </div>
                    <div class="campo">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" placeholder="Apellidos">
                        <div class="mensaje-error-admin" id="err-apellidos"></div>
                    </div>
                </div>

                <div class="campo">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" placeholder="correo@duoc.cl">
                    <div class="mensaje-error-admin" id="err-correo"></div>
                </div>

                <div class="campo">
                    <label for="clave">Contraseña <span id="ayuda-clave" style="font-weight:400;color:#888;"></span></label>
                    <input type="password" id="clave" placeholder="Entre 4 y 10 caracteres">
                    <div class="mensaje-error-admin" id="err-clave"></div>
                </div>

                <div class="campo">
                    <label for="tipoUsuario">Tipo de usuario</label>
                    <select id="tipoUsuario">
                        <option value="Administrador">Administrador</option>
                        <option value="Vendedor">Vendedor</option>
                        <option value="Cliente">Cliente</option>
                    </select>
                    <div class="mensaje-error-admin" id="err-tipoUsuario"></div>
                </div>

                <div class="fila-2">
                    <div class="campo">
                        <label for="region">Región</label>
                        <select id="region"></select>
                    </div>
                    <div class="campo">
                        <label for="comuna">Comuna</label>
                        <select id="comuna"></select>
                    </div>
                </div>

                <div class="campo">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" placeholder="Dirección">
                    <div class="mensaje-error-admin" id="err-direccion"></div>
                </div>

                <div class="resultado-admin" id="resultado-usuario"></div>

                <button type="button" class="btn-admin" onclick="guardarFormularioUsuario()">
                    <i class="bi bi-check-lg"></i> Guardar usuario
                </button>
            </form>
        </main>
    </div>

    <script src="../js/baseDeDatos.js"></script>
    <script src="../js/usuariosDB.js"></script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/regiones.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/usuario-form.js"></script>
</body>
</html>
