<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categoría - Panel Administrador</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-wrapper">
        <!-- ===== MENÚ LATERAL ===== -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <img src="../img/logo digital audio.png" alt="Digital Sounds">
                <span>Digital Sounds</span>
            </div>
            <nav class="admin-menu">
                <a href="home.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                <a href="ordenes.html"><i class="bi bi-receipt"></i> Órdenes</a>
                <a href="productos.html"><i class="bi bi-box-seam"></i> Productos</a>
                <a href="categorias.html" class="activo solo-admin"><i class="bi bi-tags"></i> Categorías</a>
                <a href="usuarios.html" class="solo-admin"><i class="bi bi-people"></i> Usuarios</a>
                <a href="reportes.html" class="solo-admin"><i class="bi bi-bar-chart-line"></i> Reportes</a>
                <a href="perfil.html"><i class="bi bi-person-circle"></i> Perfil</a>
                <a href="../proyecto.html"><i class="bi bi-shop"></i> Ver tienda</a>
            </nav>
            <div class="admin-usuario-box">
                <div class="nombre" id="admin-usuario-nombre">-</div>
                <div class="rol" id="admin-usuario-rol">-</div>
                <button class="btn-cerrar-sesion" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
            </div>
        </aside>

        <!-- ===== CONTENIDO ===== -->
        <main class="admin-contenido">
            <div class="admin-topbar">
                <h1 id="titulo-form">Nueva Categoría</h1>
                <a href="categorias.html" class="btn-admin secundario"><i class="bi bi-arrow-left"></i> Volver al listado</a>
            </div>

            <form class="form-admin" id="form-categoria" novalidate>
                <input type="hidden" id="nombre-original">
                <div class="campo">
                    <label for="nombre">Nombre de la categoría</label>
                    <input type="text" id="nombre" maxlength="50" placeholder="Ej: Instrumentos de Viento">
                    <div class="mensaje-error-admin" id="err-nombre"></div>
                </div>
                <p class="texto-suave" id="aviso-edicion" hidden>Al renombrar la categoría, todos sus productos se moverán automáticamente al nuevo nombre.</p>
                <div class="resultado-admin" id="resultado-categoria"></div>
                <button type="submit" class="btn-admin"><i class="bi bi-check-lg"></i> Guardar categoría</button>
            </form>
        </main>
    </div>

    <script src="../js/baseDeDatos.js"></script>
    <script src="../js/usuariosDB.js"></script>
    <script src="../js/ordenesDB.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/categoria-form.js"></script>
</body>
</html>
