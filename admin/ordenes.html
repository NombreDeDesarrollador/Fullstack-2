<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órdenes - Panel Administrador</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-wrapper">
        <!-- ===== MENÚ LATERAL ===== -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <img src="../img/logo digital audio.png" alt="Digital Sounds">
                <span>Digital Sounds</span>
            </div>
            <nav class="admin-menu">
                <a href="home.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                <a href="ordenes.html" class="activo"><i class="bi bi-receipt"></i> Órdenes</a>
                <a href="productos.html"><i class="bi bi-box-seam"></i> Productos</a>
                <a href="categorias.html" class="solo-admin"><i class="bi bi-tags"></i> Categorías</a>
                <a href="usuarios.html" class="solo-admin"><i class="bi bi-people"></i> Usuarios</a>
                <a href="reportes.html" class="solo-admin"><i class="bi bi-bar-chart-line"></i> Reportes</a>
                <a href="perfil.html"><i class="bi bi-person-circle"></i> Perfil</a>
                <a href="../proyecto.html"><i class="bi bi-shop"></i> Ver tienda</a>
            </nav>
            <div class="admin-usuario-box">
                <div class="nombre" id="admin-usuario-nombre">-</div>
                <div class="rol" id="admin-usuario-rol">-</div>
                <button class="btn-cerrar-sesion" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
            </div>
        </aside>

        <!-- ===== CONTENIDO ===== -->
        <main class="admin-contenido">
            <div class="admin-topbar">
                <div>
                    <h1>Órdenes / Boletas</h1>
                    <p class="admin-subtitulo">Seguimiento de todas las compras realizadas en la tienda.</p>
                </div>
            </div>

            <div class="mini-resumen" id="resumen-ordenes"></div>

            <div class="filtros-admin">
                <div class="campo-filtro">
                    <label for="buscar-orden">Buscar</label>
                    <input type="search" id="buscar-orden" placeholder="N° de orden, cliente o correo">
                </div>
                <div class="campo-filtro">
                    <label for="filtro-estado">Estado</label>
                    <select id="filtro-estado">
                        <option value="">Todos</option>
                        <option value="Pagada">Pagada</option>
                        <option value="Rechazada">Rechazada</option>
                    </select>
                </div>
            </div>

            <div class="admin-panel">
                <table class="tabla-admin">
                    <thead>
                        <tr><th>N° Orden</th><th>Fecha</th><th>Cliente</th><th>Productos</th><th>Total</th><th>Estado</th><th>Acciones</th></tr>
                    </thead>
                    <tbody id="tabla-ordenes-body"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/baseDeDatos.js"></script>
    <script src="../js/usuariosDB.js"></script>
    <script src="../js/ordenesDB.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ordenes.js"></script>
</body>
</html>
