<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil - Panel Administrador</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-wrapper">
        <!-- ===== MENÚ LATERAL ===== -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <img src="../img/logo digital audio.png" alt="Digital Sounds">
                <span>Digital Sounds</span>
            </div>
            <nav class="admin-menu">
                <a href="home.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                <a href="ordenes.html"><i class="bi bi-receipt"></i> Órdenes</a>
                <a href="productos.html"><i class="bi bi-box-seam"></i> Productos</a>
                <a href="categorias.html" class="solo-admin"><i class="bi bi-tags"></i> Categorías</a>
                <a href="usuarios.html" class="solo-admin"><i class="bi bi-people"></i> Usuarios</a>
                <a href="reportes.html" class="solo-admin"><i class="bi bi-bar-chart-line"></i> Reportes</a>
                <a href="perfil.html" class="activo"><i class="bi bi-person-circle"></i> Perfil</a>
                <a href="../proyecto.html"><i class="bi bi-shop"></i> Ver tienda</a>
            </nav>
            <div class="admin-usuario-box">
                <div class="nombre" id="admin-usuario-nombre">-</div>
                <div class="rol" id="admin-usuario-rol">-</div>
                <button class="btn-cerrar-sesion" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
            </div>
        </aside>

        <!-- ===== CONTENIDO ===== -->
        <main class="admin-contenido">
            <div class="admin-topbar">
                <div>
                    <h1>Mi perfil</h1>
                    <p class="admin-subtitulo">Administra tu información personal y la configuración de tu cuenta.</p>
                </div>
            </div>

            <div class="perfil-simple">
                <div class="perfil-card">
                    <div class="perfil-cabecera">
                        <h2 id="perfil-nombre">-</h2>
                        <span class="rol-simple" id="perfil-rol">-</span>
                    </div>
                    <dl class="ficha-datos">
                        <div><dt>Correo</dt><dd id="perfil-correo">-</dd></div>
                        <div><dt>RUN</dt><dd id="perfil-run">-</dd></div>
                    </dl>
                </div>

                <form class="form-admin" id="form-perfil" novalidate>
                    <h2>Datos personales</h2>
                    <div class="fila-2">
                        <div class="campo">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" maxlength="50">
                            <div class="mensaje-error-admin" id="err-nombre"></div>
                        </div>
                        <div class="campo">
                            <label for="apellidos">Apellidos</label>
                            <input type="text" id="apellidos" maxlength="100">
                            <div class="mensaje-error-admin" id="err-apellidos"></div>
                        </div>
                    </div>
                    <div class="fila-2">
                        <div class="campo">
                            <label for="telefono">Teléfono (opcional)</label>
                            <input type="tel" id="telefono" placeholder="+56 9 1234 5678">
                            <div class="mensaje-error-admin" id="err-telefono"></div>
                        </div>
                        <div class="campo">
                            <label for="direccion">Dirección</label>
                            <input type="text" id="direccion" maxlength="300">
                            <div class="mensaje-error-admin" id="err-direccion"></div>
                        </div>
                    </div>

                    <h2>Cambiar contraseña <span class="ayuda-campo">(déjalo en blanco para mantener la actual)</span></h2>
                    <div class="fila-2">
                        <div class="campo">
                            <label for="clave">Nueva contraseña</label>
                            <input type="password" id="clave" placeholder="Entre 4 y 10 caracteres">
                            <div class="mensaje-error-admin" id="err-clave"></div>
                        </div>
                        <div class="campo">
                            <label for="clave2">Confirmar contraseña</label>
                            <input type="password" id="clave2">
                            <div class="mensaje-error-admin" id="err-clave2"></div>
                        </div>
                    </div>

                    <div class="resultado-admin" id="resultado-perfil"></div>
                    <button type="submit" class="btn-admin"><i class="bi bi-check-lg"></i> Guardar cambios</button>
                </form>
            </div>
        </main>
    </div>

    <script src="../js/baseDeDatos.js"></script>
    <script src="../js/usuariosDB.js"></script>
    <script src="../js/ordenesDB.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
