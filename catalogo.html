<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de sonidos - Catálogo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .galeria-catalogo { display: flex; flex-wrap: wrap; gap: 25px; justify-content: flex-start; margin: 20px 0 40px; }
        .categoria-bloque h2 { margin-top: 35px; }
        .producto-card { width: 220px; padding: 25px 15px 20px; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,.08); display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; transition: transform .2s ease, box-shadow .2s ease; }
        .producto-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,.15); }
        .producto-card img { width: 100%; height: 130px; object-fit: contain; margin-bottom: 15px; }
        .producto-card h4 { margin: 5px 0; color: #222222; font-size: 1rem; }
        .producto-card p { margin: 3px 0; color: #444444; font-size: .85rem; }
        .producto-card .codigo { margin-bottom: 5px; padding: 2px 10px; border-radius: 12px; background: #f2f2f2; color: #888888; font-size: .75rem; font-weight: 600; }
        .producto-card .desc { margin-top: 6px; color: #666666; font-size: .78rem; line-height: 1.3; }
        .enlace-tarjeta { color: inherit; text-decoration: none; }
    </style>
</head>
<body>
    <div class="barra-promo">
        <span>Envío gratis <strong>en compras sobre $50.000</strong></span>
        <span>12 cuotas <strong>sin interés con Webpay</strong></span>
        <span>Retira <strong>en tienda · gratis</strong></span>
        <div class="barra-promo-derecha">
            <a href="#"><i class="bi bi-whatsapp"></i> WhatsApp</a>
            <a href="#"><i class="bi bi-shop"></i> Tiendas</a>
            <a href="#">Ayuda</a>
        </div>
    </div>
    <header class="header-principal">
        <a href="proyecto.html" class="logo-header"><img src="img/logo digital audio.png" alt="Digital Audio"></a>
        <div class="buscador-header"><input type="text" placeholder="Busca instrumentos, marcas, accesorios..."><button type="button"><i class="bi bi-arrow-right"></i></button></div>
        <div class="iconos-header">
            <a href="login.html"><i class="bi bi-person"></i><span>Cuenta</span></a>
            <a href="#"><i class="bi bi-heart"></i><span>Favoritos</span></a>
            <a href="#" class="carro-btn"><i class="bi bi-cart"></i><span>Carro</span></a>
        </div>
    </header>
    <main class="container">
        <nav class="menu-principal">
            <a href="proyecto.html" class="btn-menu">Inicio</a>
            <a href="catalogo.html" class="btn-menu activo">Catálogo Completo</a>
            <a href="sobreNosotros.html" class="btn-menu">Sobre Nosotros</a>
            <a href="#" class="btn-menu">Contacto</a>
            <a href="#" class="btn-menu">Ofertas</a>
        </nav>
        <h1>CATÁLOGO DE PRODUCTOS</h1>
        <div id="contenedor-catalogo"></div>
    </main>
    <footer class="footer-centrado"><p>&copy; 2026 Digital Sounds - Todos los derechos reservados</p></footer>
    <script src="js/baseDeDatos.js"></script>
    <script src="js/catalogo.js"></script>
</body>
</html>
