<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Carrito - Digital Audio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header-principal">
    <a href="proyecto.html" class="logo-header"><img src="img/logo digital audio.png" alt="Digital Audio"></a>
    <div class="buscador-header"><input type="search" aria-label="Buscar productos por nombre" placeholder="Buscar por nombre..."><button type="button"><i class="bi bi-arrow-right"></i></button></div>
    <div class="iconos-header">
      <a href="login.html"><i class="bi bi-person"></i><span>Cuenta</span></a>
      <a href="carrito.html" class="carro-btn" id="carrito-button"><i class="bi bi-cart"></i><span>Carro</span><span id="carrito-badge" class="badge">0</span></a>
    </div>
  </header>
  <nav class="menu-principal">
      <a href="proyecto.html" class="btn-menu">Inicio</a>
      <a href="catalogo.html" class="btn-menu">Catálogo Completo</a>
      <a href="categorias.html" class="btn-menu">Categorías</a>
      <a href="ofertas.html" class="btn-menu">Ofertas</a>
      <a href="blogs.html" class="btn-menu">Blog</a>
      <a href="sobreNosotros.html" class="btn-menu">Sobre Nosotros</a>
      <a href="contacto.html" class="btn-menu">Contacto</a>
  </nav>
  <main class="carrito-container">
    <div class="carrito-encabezado">
      <div>
        <p class="carrito-etiqueta">DIGITAL AUDIO</p>
        <h1>Tu Carrito de Compras</h1>
      </div>
      <i class="bi bi-bag-heart carrito-encabezado-icono"></i>
    </div>
    <div id="carrito-items"></div>
    <div class="carrito-summary">
      <div class="carrito-total-texto">
        <span>Total de tu pedido</span>
        <strong><span id="carrito-total">$0</span></strong>
      </div>
      <div class="carrito-acciones">
        <button id="vaciar-btn" type="button"><i class="bi bi-trash3"></i><span>Vaciar carrito</span></button>
        <button id="checkout-btn"><i class="bi bi-credit-card-2-front"></i><span>Ir a pagar</span></button>
      </div>
    </div>
    <a href="proyecto.html" class="btn-volver-menu"><i class="bi bi-house-fill"></i> Volver al menú principal</a>
  </main>
  <footer class="footer-centrado"><p>&copy; 2026 Digital Audio — Todos los derechos reservados</p></footer>

  <script src="js/carrito.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/busqueda.js"></script>
</body>
</html>
